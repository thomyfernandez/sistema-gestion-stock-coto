# Base relacional temporal con fixtures. El perfil postgres conserva los datos entre reinicios.
spring.datasource.url=jdbc:h2:mem:coto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
# En demo, si no se define COTO_JWT_SECRET, se genera una clave efímera aleatoria en cada arranque.
coto.seguridad.jwt.secreto=${COTO_JWT_SECRET:${random.uuid}}
