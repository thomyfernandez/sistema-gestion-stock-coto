spring.datasource.url=${COTO_DB_URL:jdbc:postgresql://localhost:5432/coto_stock}
spring.datasource.username=${COTO_DB_USER:coto}
spring.datasource.password=${COTO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Inicializar una vez con schema.sql + data.sql; nunca reinicializar al arrancar.
spring.sql.init.mode=never
