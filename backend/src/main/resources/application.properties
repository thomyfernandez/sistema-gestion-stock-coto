spring.application.name=coto-gestion-stock
server.address=${COTO_SERVER_ADDRESS:127.0.0.1}
server.port=${COTO_SERVER_PORT:8080}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
coto.web.origenes=http://localhost:5173,http://127.0.0.1:5173
spring.profiles.default=demo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
coto.integraciones.reintento-ms=5000
coto.integraciones.automaticas=true
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
